name: gtk-theme-pocillo
build-base: core24
base: bare
adopt-info: gtk-theme-pocillo
platforms:
  all:
    build-on: [amd64]
    build-for: [all]
summary: Pocillo GTK theme for GTK Snaps
description: |
  A snap that exports the Pocillo GTK theme.
grade: stable
confinement: strict
compression: lzo

slots:
  gtk-3-themes:
    interface: content
    source:
      read:
        - $SNAP/usr/share/themes/Pocillo
        - $SNAP/usr/share/themes/Pocillo-dark
        - $SNAP/usr/share/themes/Pocillo-darkest
        - $SNAP/usr/share/themes/Pocillo-frappe
        - $SNAP/usr/share/themes/Pocillo-light
        - $SNAP/usr/share/themes/Pocillo-slim
        - $SNAP/usr/share/themes/Pocillo-slim-dark
        - $SNAP/usr/share/themes/Pocillo-slim-darkest
        - $SNAP/usr/share/themes/Pocillo-slim-frappe
        - $SNAP/usr/share/themes/Pocillo-slim-light


parts:
  gtk-theme-pocillo:
    plugin: meson
    source: https://github.com/UbuntuBudgie/pocillo-gtk-theme.git
    build-packages: [meson, sass, npm]
    meson-parameters: [--prefix=/usr]
    override-build: |
      craftctl default
      craftctl set version=$(date +%Y-%m-%d)
    prime:
      - usr/share/themes/*/gtk-3.0
      - usr/share/themes/*/gtk-4.0
